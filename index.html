<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>MyPlan</title>
<meta name="theme-color" content="#F6F9DF">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="MyPlan">
<meta name="apple-mobile-web-app-status-bar-style" content="default">
<link rel="manifest" href="manifest.webmanifest">
<link rel="apple-touch-icon" href="apple-touch-icon.png">
<link rel="icon" type="image/png" href="icon-192.png">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;500;600;700;800;900&family=Patrick+Hand&display=swap">
<style>
:root{
  color-scheme:light;
  --bg:#F6F9DF; --hero-a:#EAF6C8; --hero-b:#F5FBD6;
  --surface:#FFFFFF; --surface-2:#F7F9EC; --line:#EBEFD9;
  --ink:#2C4220; --ink-2:#5D6E50; --ink-3:#9AA58E;
  --accent:#7AB648; --accent-deep:#4F8A2A; --accent-ink:#FFFFFF; --accent-soft:#EFF9E1;
  --yellow:#FCD660; --amber:#A87A0A; --yellow-soft:#FFF5D2;
  --pink:#E86B7C; --pink-deep:#C8475A; --pink-soft:#FDE6E9;
  --blue:#4A9AD4; --blue-deep:#2F7AB3; --blue-soft:#E5F7FD;
  --violet:#8A77DC; --violet-deep:#6A56C4; --violet-soft:#ECE8FB;
  --teal:#35A596; --teal-deep:#1F8274; --teal-soft:#DDF3EF;
  --gray:#8A9580; --gray-deep:#65705C; --gray-soft:#EEF1E6;
  --chip-on-soft:rgba(255,255,255,.75);
  --danger:#D2434F;
  --shadow:0 2px 6px rgba(76,100,40,.05),0 10px 30px rgba(76,100,40,.07);
  --r:26px;
}
@media (prefers-color-scheme:dark){
  :root:not([data-theme="light"]){
    color-scheme:dark;
    --bg:#131810; --hero-a:#1F2B16; --hero-b:#192114;
    --surface:#1A2115; --surface-2:#212A1B; --line:#2D3825;
    --ink:#EAF1DF; --ink-2:#B3C0A6; --ink-3:#7F8B74;
    --accent:#8FCB5A; --accent-deep:#A9DA7E; --accent-ink:#13200B; --accent-soft:#26361C;
    --yellow:#F2CC5B; --amber:#F2CC5B; --yellow-soft:#3A3217;
    --pink:#F08D9A; --pink-deep:#F5A5B0; --pink-soft:#3B2226;
    --blue:#78B8E6; --blue-deep:#96CAF0; --blue-soft:#1B2E3B;
    --violet:#AB9BEE; --violet-deep:#C0B4F4; --violet-soft:#2A2640;
    --teal:#6FCFBF; --teal-deep:#92DDD1; --teal-soft:#16332F;
    --gray:#9AA590; --gray-deep:#B7C0AE; --gray-soft:#262E21;
    --chip-on-soft:rgba(0,0,0,.25);
    --danger:#F07782;
    --shadow:0 1px 2px rgba(0,0,0,.35);
  }
}
:root[data-theme="dark"]{
  color-scheme:dark;
  --bg:#131810; --hero-a:#1F2B16; --hero-b:#192114;
  --surface:#1A2115; --surface-2:#212A1B; --line:#2D3825;
  --ink:#EAF1DF; --ink-2:#B3C0A6; --ink-3:#7F8B74;
  --accent:#8FCB5A; --accent-deep:#A9DA7E; --accent-ink:#13200B; --accent-soft:#26361C;
  --yellow:#F2CC5B; --amber:#F2CC5B; --yellow-soft:#3A3217;
  --pink:#F08D9A; --pink-deep:#F5A5B0; --pink-soft:#3B2226;
  --blue:#78B8E6; --blue-deep:#96CAF0; --blue-soft:#1B2E3B;
  --violet:#AB9BEE; --violet-deep:#C0B4F4; --violet-soft:#2A2640;
  --teal:#6FCFBF; --teal-deep:#92DDD1; --teal-soft:#16332F;
  --gray:#9AA590; --gray-deep:#B7C0AE; --gray-soft:#262E21;
  --chip-on-soft:rgba(0,0,0,.25);
  --danger:#F07782;
  --shadow:0 1px 2px rgba(0,0,0,.35);
}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--ink);font:15px/1.5 "Nunito",system-ui,-apple-system,"Segoe UI",sans-serif;font-weight:500;padding-inline:16px;padding-top:env(safe-area-inset-top,0px);-webkit-text-size-adjust:100%}
[hidden]{display:none!important}
img{max-width:100%;display:block}
button,input,select,textarea{font:inherit;color:inherit}
button{cursor:pointer}
:focus-visible{outline:2px solid var(--accent);outline-offset:2px;border-radius:10px}
h1,h2,h3{margin:0;text-wrap:balance;font-weight:800;letter-spacing:-.01em}
.num{font-variant-numeric:tabular-nums}
.hand{font-family:"Patrick Hand","Comic Sans MS",cursive;font-weight:400;color:var(--ink);line-height:1.25}
.wrap{max-width:1240px;margin:0 auto;padding-block:16px 40px}

/* header */
header.top{display:flex;align-items:center;gap:12px;padding:10px 14px 10px 22px;background:var(--surface);border-radius:var(--r);box-shadow:var(--shadow)}
.logo{display:flex;align-items:center;gap:8px;font-weight:900;font-size:26px;letter-spacing:-.02em;color:var(--ink);margin-right:18px}
nav.tabs{display:flex;gap:6px;flex:1}
nav.tabs button{display:flex;align-items:center;gap:9px;border:0;background:none;padding:11px 20px;border-radius:999px;color:var(--ink-2);font-weight:600;font-size:15.5px}
nav.tabs button:hover{background:var(--surface-2)}
nav.tabs button[aria-current="page"]{background:var(--yellow);color:#2C4220;font-weight:700}
.round-btn{width:46px;height:46px;border-radius:50%;border:1px solid var(--line);background:var(--surface);display:grid;place-items:center;color:var(--amber);flex:none}
.round-btn:hover{background:var(--surface-2)}
.me{display:flex;align-items:center;gap:10px;border:0;background:none;padding:4px 8px 4px 4px;border-radius:999px;font-weight:700}
.me:hover{background:var(--surface-2)}
.avatar{width:42px;height:42px;border-radius:50%;background:var(--yellow);color:#2C4220;display:grid;place-items:center;font-weight:800;font-size:17px;flex:none}

main{margin-top:18px}
.card{background:var(--surface);border-radius:var(--r);padding:22px;box-shadow:var(--shadow);min-width:0}
.card-h{display:flex;align-items:center;justify-content:space-between;gap:12px;margin-bottom:14px;flex-wrap:wrap}
.card-h h2{font-size:24px}
.muted{color:var(--ink-2)}
.pill-btn{display:inline-flex;align-items:center;gap:8px;border:0;background:var(--accent);color:var(--accent-ink);padding:10px 20px;border-radius:999px;font-weight:700}
.pill-btn:hover{filter:brightness(1.05)}
.ghost-btn{display:inline-flex;align-items:center;gap:6px;border:1px solid var(--line);background:var(--surface);padding:8px 16px;border-radius:999px;font-weight:600;color:var(--ink-2)}
.ghost-btn:hover{background:var(--surface-2)}
.link-btn{border:0;background:none;padding:4px 2px;color:var(--ink-2);font-weight:600;display:inline-flex;align-items:center;gap:4px}
.link-btn:hover{color:var(--ink)}
.icon-btn{border:0;background:none;width:36px;height:36px;border-radius:12px;display:grid;place-items:center;color:var(--ink-2);flex:none}
.icon-btn:hover{background:var(--surface-2);color:var(--ink)}
.add-round{width:48px;height:48px;border-radius:50%;border:0;background:var(--surface);box-shadow:var(--shadow);display:grid;place-items:center;color:var(--ink);flex:none}
.btn{border:1px solid var(--line);background:var(--surface);padding:9px 16px;border-radius:999px;font-weight:600}
.btn:hover{background:var(--surface-2)}
.btn.primary{background:var(--accent);color:var(--accent-ink);border-color:transparent;font-weight:700}
.btn.danger{color:var(--danger)}
.btn.danger.armed{background:var(--danger);color:#fff;border-color:transparent}
.empty{color:var(--ink-3);padding:22px 4px;text-align:center}

/* colour helpers */
.c-green{color:var(--accent-deep);background:var(--accent-soft)} .c-yellow{color:var(--amber);background:var(--yellow-soft)}
.c-pink{color:var(--pink-deep);background:var(--pink-soft)} .c-blue{color:var(--blue-deep);background:var(--blue-soft)}
.c-violet{color:var(--violet-deep);background:var(--violet-soft)} .c-teal{color:var(--teal-deep);background:var(--teal-soft)}
.c-gray{color:var(--gray-deep);background:var(--gray-soft)}
.bg-green{background:var(--accent)} .bg-yellow{background:var(--yellow)} .bg-pink{background:var(--pink)}
.bg-blue{background:var(--blue)} .bg-violet{background:var(--violet)} .bg-teal{background:var(--teal)} .bg-gray{background:var(--gray)}
.soft-green{background:var(--accent-soft)} .soft-yellow{background:var(--yellow-soft)} .soft-pink{background:var(--pink-soft)}
.soft-blue{background:var(--blue-soft)} .soft-violet{background:var(--violet-soft)} .soft-teal{background:var(--teal-soft)} .soft-gray{background:var(--gray-soft)}
.chip{font-size:13.5px;font-weight:600;padding:5px 16px;border-radius:999px;white-space:nowrap;flex:none}

/* home */
.home{display:grid;grid-template-columns:1.12fr 1fr;gap:18px;align-items:start}
.col{display:flex;flex-direction:column;gap:18px;min-width:0}
.hero{padding:0;overflow:hidden}
.hero-top{position:relative;display:flex;align-items:flex-end;justify-content:space-between;gap:8px;background:linear-gradient(120deg,var(--hero-a),var(--hero-b));padding:28px 20px 0 34px;min-height:220px;border-radius:var(--r) var(--r) 0 0}
.hero-text{padding-bottom:26px;min-width:0}
.hero-text .hi{margin:0;font-size:28px;font-weight:800;line-height:1.1}
.hero-text h1{font-size:52px;line-height:1.05;display:flex;align-items:center;gap:8px;white-space:nowrap}
.hero-text p{margin:12px 0 0;font-size:18px;color:var(--ink-2);max-width:28ch}
.hero-art{position:relative;flex:none;width:300px;align-self:flex-end}
.hero-art img{width:100%}
.bubble{position:absolute;right:-6px;top:4px;background:var(--surface);padding:10px 14px;border-radius:50%;font-size:18px;text-align:center;transform:rotate(-8deg);box-shadow:var(--shadow)}
.tiles{display:grid;grid-template-columns:repeat(4,1fr);gap:12px;padding:14px}
.tile{position:relative;border-radius:20px;padding:16px 14px;min-height:128px;overflow:hidden}
.tile .t-ic{position:absolute;left:14px;top:16px}
.tile .t-lb,.tile b,.tile small{position:relative;z-index:1}
.tile .t-lb{margin-left:40px;font-weight:700;font-size:15px}
.tile b{display:block;margin:10px 0 0 40px;font-size:36px;line-height:1;font-weight:900}
.tile small{display:block;margin:6px 0 0 40px;color:var(--ink-2);font-size:14px;line-height:1.2;white-space:nowrap}
.tile img{position:absolute;right:4px;bottom:4px;width:58px;height:auto;z-index:0}
.tile{container-type:inline-size}
@container (max-width:170px){.tile img{width:40px}.tile small{margin-left:0}}
.ring-card{display:none}

.tlist{list-style:none;margin:0;padding:0}
.task{display:flex;align-items:center;gap:14px;padding:16px 8px;border-top:1px solid var(--line)}
.task:first-child{border-top:0}
.chk{width:36px;height:36px;border-radius:50%;border:2px solid var(--gray);background:var(--surface);display:grid;place-items:center;flex:none;color:transparent;padding:0}
.chk:hover{border-color:var(--accent)}
.chk svg{width:18px;height:18px}
.done .chk,.chk.on{background:var(--accent);border-color:var(--accent);color:#fff}
.t-main{flex:1;min-width:0;cursor:pointer}
.t-title{font-weight:700;font-size:16.5px;overflow-wrap:anywhere}
.t-sub{display:flex;flex-wrap:wrap;gap:2px 10px;font-size:13.5px;color:var(--ink-3)}
.t-sub .late{color:var(--danger);font-weight:700}
.t-sub .doing{color:var(--amber);font-weight:700}
.t-sub .tm,.t-sub .m-chip{display:none}
.t-sub .m-chip{font-size:11.5px;padding:2px 10px;margin-top:3px}
.t-time{display:flex;align-items:center;gap:8px;color:var(--ink-2);min-width:128px;font-size:15px}
.task.done .t-title{color:var(--ink-3)}

/* month grid */
.mgrid{display:grid;grid-template-columns:repeat(7,minmax(0,1fr));text-align:center;row-gap:2px}
.mgrid .dow{font-weight:700;font-size:14px;padding:6px 0 10px}
.mday{border:0;background:none;padding:4px 0;border-radius:14px;display:flex;flex-direction:column;align-items:center;gap:3px;font-weight:600;font-size:16px;color:var(--ink)}
.mday:hover{background:var(--surface-2)}
.mday .n{width:44px;height:44px;border-radius:50%;display:grid;place-items:center}
.mday.out{color:var(--accent)}
.mday.out .n{opacity:.75}
.mday.today .n{background:var(--accent);color:#fff;font-weight:800}
.mday.sel:not(.today) .n{box-shadow:inset 0 0 0 2px var(--accent)}
.dots{display:flex;gap:3px;min-height:6px;justify-content:center}
.dot{width:6px;height:6px;border-radius:50%}
.month-nav{display:flex;align-items:center;gap:6px}
.seg{display:flex;border:1px solid var(--line);border-radius:999px;overflow:hidden}
.seg button{border:0;background:var(--surface);width:44px;height:38px;display:grid;place-items:center;color:var(--ink-2)}
.seg button+button{border-left:1px solid var(--line)}
.seg button:hover{background:var(--surface-2)}
.calcard{display:grid;grid-template-columns:1fr 170px;gap:12px}
.calside{display:flex;flex-direction:column;gap:12px;align-items:center}
.calside .note{background:var(--hero-a);border-radius:22px;padding:18px 14px;font-size:19px;transform:rotate(-4deg);text-align:left}

/* goals */
.goal-row{display:grid;grid-template-columns:88px 1fr auto;gap:4px 16px;align-items:center;padding:12px;border-radius:22px;background:var(--surface);box-shadow:var(--shadow);margin-bottom:12px}
.goal-row:last-child{margin-bottom:0}
.g-ic{width:88px;height:88px;border-radius:20px;display:grid;place-items:center;grid-row:1/4;overflow:hidden}
.g-ic img{width:76px}
.g-title{font-weight:800;font-size:17px;overflow-wrap:anywhere}
.g-desc{color:var(--ink-2);font-size:14px;grid-column:2/4}
.g-bar{display:flex;align-items:center;gap:14px;grid-column:2/4}
.bar{flex:1;height:14px;border-radius:99px;background:var(--gray-soft);overflow:hidden}
.bar i{display:block;height:100%;border-radius:99px}
.g-pct{font-weight:800;min-width:44px;text-align:right}
.g-meta{grid-column:2/4;display:flex;gap:16px;flex-wrap:wrap;color:var(--ink-3);font-size:13.5px}
.g-meta span{display:inline-flex;align-items:center;gap:6px}
.goal-grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(340px,1fr));gap:16px}
.goal-grid .goal-row{margin:0}

/* page heads */
.page-head{position:relative;display:flex;align-items:center;justify-content:space-between;gap:12px;background:linear-gradient(120deg,var(--hero-a),var(--hero-b));border-radius:var(--r);padding:24px 26px;margin-bottom:18px;overflow:hidden}
.page-head h1{font-size:40px;line-height:1.1}
.page-head p{margin:6px 0 0;color:var(--ink-2);font-size:16px;max-width:40ch}
.page-head .ph-art{width:150px;flex:none}
.page-head .ph-actions{display:flex;align-items:center;gap:14px}

/* calendar page */
.cal-layout{display:grid;grid-template-columns:1.1fr 1fr;gap:18px;align-items:start}
.wstrip{display:none}
.timeline{list-style:none;margin:0;padding:0;position:relative}
.tl{display:grid;grid-template-columns:52px 16px 1fr;gap:10px;align-items:stretch;padding-bottom:12px}
.tl-time{font-weight:700;font-size:14px;color:var(--ink-2);padding-top:18px}
.tl-line{position:relative}
.tl-line::before{content:"";position:absolute;left:50%;top:0;bottom:-12px;border-left:2px dashed var(--line);transform:translateX(-50%)}
.tl:last-child .tl-line::before{bottom:0}
.tl-line .dot{position:absolute;left:50%;top:22px;width:11px;height:11px;transform:translateX(-50%);box-shadow:0 0 0 3px var(--surface)}
.tl-card{display:flex;align-items:center;gap:12px;border-radius:20px;padding:14px 14px 14px 18px;min-width:0}
.tl-card .tl-body{flex:1;min-width:0;cursor:pointer}
.tl-card b{display:block;font-size:16px;font-weight:800;overflow-wrap:anywhere}
.tl-card small{display:block;color:var(--ink-2);font-size:13.5px;margin:1px 0 6px;overflow-wrap:anywhere}
.tl-card .chip{background:var(--chip-on-soft);font-size:12.5px;padding:3px 12px}
.tl.done b{text-decoration:line-through;text-decoration-color:var(--ink-3)}
.tl-card .chk{width:30px;height:30px}

/* tasks page */
.toolbar{display:flex;flex-wrap:wrap;gap:10px;align-items:center;margin-bottom:12px}
.chips{display:flex;gap:6px;flex-wrap:wrap}
.fchip{border:1px solid var(--line);background:var(--surface);padding:7px 16px;border-radius:999px;font-size:14px;font-weight:600;color:var(--ink-2)}
.fchip[aria-pressed="true"]{background:var(--yellow);border-color:var(--yellow);color:#2C4220}
.field{border:1px solid var(--line);background:var(--surface);border-radius:14px;padding:9px 14px;min-width:0}
.search{flex:1 1 200px}
.group-h{font-size:13px;text-transform:uppercase;letter-spacing:.06em;color:var(--ink-3);font-weight:800;margin:20px 0 2px}
.group-h:first-child{margin-top:4px}
.group-h.late{color:var(--danger)}

/* stats */
.sec-title{font-size:26px;margin:30px 0 14px}
.girl-note{display:flex;align-items:center;justify-content:center;gap:10px;margin-top:10px}
.girl-note .hand{font-size:22px;transform:rotate(-6deg);max-width:13ch}
.girl-note img{width:230px}
.kpis{display:grid;grid-template-columns:repeat(4,1fr);gap:16px}
.kpi span{color:var(--ink-2);font-weight:600}
.kpi b{display:block;font-size:34px;font-weight:900;line-height:1.2}
.kpi small{display:block;color:var(--ink-3);font-size:13px;margin-top:4px}
.two{display:grid;grid-template-columns:1.6fr 1fr;gap:16px;margin-top:16px}
.chart{width:100%;height:auto;display:block}
.chart .grid{stroke:var(--line)}
.chart text{fill:var(--ink-3);font-size:11px;font-family:inherit}
.chart .val{fill:var(--ink-2);font-weight:700}
.chart .b{fill:var(--accent-soft)}
.chart .b.on{fill:var(--accent)}
.cat-row{display:grid;grid-template-columns:1fr auto;gap:6px 12px;padding:10px 0;border-top:1px solid var(--line)}
.cat-row:first-child{border-top:0}
.cat-row .bar{grid-column:1/3;height:10px}

/* modal, toast, auth */
.overlay{position:fixed;inset:0;background:rgba(20,30,10,.45);display:grid;place-items:center;padding:16px;z-index:50}
.modal{background:var(--surface);border-radius:26px;padding:24px;width:min(500px,100%);max-height:calc(100% - 32px);overflow:auto}
.modal h3{font-size:21px;margin-bottom:16px}
.form{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.form label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink-2);font-weight:700;min-width:0}
.form .full{grid-column:1/-1}
.form .field{width:100%;color:var(--ink);font-size:16px;font-weight:500}
textarea.field{resize:vertical;min-height:64px}
.m-actions{display:flex;gap:8px;margin-top:20px;align-items:center}
.m-actions .sp{flex:1}
.range-row{display:flex;align-items:center;gap:12px}
.range-row input{flex:1;accent-color:var(--accent)}
.toast{position:fixed;left:50%;bottom:calc(24px + env(safe-area-inset-bottom,0px));transform:translateX(-50%);background:var(--ink);color:var(--bg);padding:11px 18px;border-radius:14px;font-weight:600;z-index:60;max-width:calc(100% - 32px)}
.loading{padding:60px 0;text-align:center;color:var(--ink-3)}
.auth{max-width:420px;margin:30px auto;text-align:left}
.auth .auth-art{width:220px;margin:0 auto 6px}
.auth h1{font-size:26px;margin-bottom:4px}
.auth p{color:var(--ink-2);margin:0 0 18px}
.auth form{display:flex;flex-direction:column;gap:12px}
.auth label{display:flex;flex-direction:column;gap:5px;font-size:13.5px;color:var(--ink-2);font-weight:700}
.auth .field{font-size:16px;color:var(--ink)}
.auth label[for]{margin-bottom:-7px}
.pw{position:relative}
.pw .field{width:100%;padding-right:52px}
.pw-eye{position:absolute;right:4px;top:50%;transform:translateY(-50%);width:44px;height:40px;border:0;background:none;border-radius:10px;display:grid;place-items:center;color:var(--ink-3)}
.pw-eye:hover,.pw-eye[aria-pressed="true"]{color:var(--accent-deep)}
.auth .msg{font-size:14px;padding:10px 14px;border-radius:14px;background:var(--yellow-soft)}
.auth .msg.ok{background:var(--accent-soft)}
.auth .switch{margin-top:14px;color:var(--ink-2)}
.auth .pill-btn{justify-content:center}
body.signed-out nav.tabs,body.signed-out #meBtn{display:none}
.push-box{background:var(--surface-2);border-radius:18px;padding:14px 16px}
.push-h{font-weight:800;color:var(--ink);font-size:15px}
.push-box p{margin:4px 0 0;color:var(--ink-2);font-weight:500;font-size:14px}

async function write(col,obj){
  const arr=S[col],i=arr.findIndex(x=>x.id===obj.id),prev=i>=0?arr[i]:null;
  if(i>=0)arr[i]=obj;else arr.push(obj);
  render();

  const row=MAP[col]?MAP[col][1](obj):toGoal(obj);

  if(col==='blocks'&&(!prev||prev.day!==obj.day||prev.start!==obj.start))row.notified_at=null;

  if(error){toast('Chưa lưu được. Kiểm tra kết nối rồi thử lại.');loadAll();return false}

}

/* ---------- số liệu nhìn lại ---------- */
// Khối đã xếp = Dự kiến + Đã làm + Bỏ đã kết thúc; Phát sinh không tính. Giờ tính cho Đã làm và Phát sinh.
function statsFor(days,blocks){
  const set=new Set(days),now=new Date(),bs=(blocks||S.blocks).filter(b=>set.has(b.day));
  const ended=b=>new Date(b.day+'T'+(b.end||b.start)+':00')<=now;
  const plannedList=bs.filter(b=>['Dự kiến','Đã làm','Bỏ'].includes(b.status)&&ended(b));
  const h={'':0};D4.forEach(k=>h[k]=0);
  bs.filter(counted).forEach(b=>{h[D4.includes(b.d4)?b.d4:'']+=bHours(b)});
  const work=WORK4.reduce((s,k)=>s+h[k],0),pct={};
  WORK4.forEach(k=>pct[k]=work?Math.round(h[k]/work*100):null);
  return {planned:plannedList.length,done:plannedList.filter(b=>b.status==='Đã làm').length,unplanned:bs.filter(b=>b.status==='Phát sinh').length,h,work,pct};
}
const lastDays=(n,end)=>[...Array(n)].map((_,i)=>ymd(addDays(end||new Date(),i-n+1)));
const d4Text=st=>[...D4.filter(k=>st.h[k]>0).map(k=>k+' '+fmtH(st.h[k])),...(st.h['']>0?['Chưa xếp 4D '+fmtH(st.h[''])]:[])].join(' · ');
function suggestion(st,k,blocks){
  const drop=(blocks||S.blocks).find(b=>b.day===k&&b.status==='Bỏ'&&b.result);
  const dropTip=drop?'Khối "'+drop.title+'" bị bỏ ('+drop.result+'): xếp lại vào một khung giờ hợp hơn.':'';
  if(!st.work)return dropTip;
  let best='',gap=0;WORK4.forEach(x=>{const g=st.pct[x]-TARGET[x];if(Math.abs(g)>Math.abs(gap)){gap=g;best=x}});
  if(Math.abs(gap)<5)return dropTip||'Tỷ lệ 4D đang gần mục tiêu, giữ nhịp này.';
  const tips={Doing:['Doing cao hơn mục tiêu '+gap+' điểm: nhờ Claude làm một việc tay chân, ví dụ soạn giáo án.','Doing thấp hơn mục tiêu '+(-gap)+' điểm: dành thêm giờ cho việc chính.'],
    Deciding:['Deciding cao hơn mục tiêu '+gap+' điểm: bớt sửa từng chi tiết việc đã giao cho AI.',''],
    Delegating:['Delegating vượt mục tiêu '+gap+' điểm: xem việc đã giao có cần mình quyết nữa không.','Delegating thấp hơn mục tiêu '+(-gap)+' điểm: giao trọn một việc cho Claude.'],
    Designing:['Designing vượt mục tiêu '+gap+' điểm: ưu tiên làm ra kết quả.','Designing thấp hơn mục tiêu '+(-gap)+' điểm: giữ 1 giờ Designing cho mẫu giáo án hoặc chatbot.']};
  return tips[best][gap>0?0:1]||dropTip;
}

function readReview(){

    const b={...S.blocks.find(x=>x.id===el.dataset.id)},q=n=>el.querySelector('[name="'+n+'"]');

    if(b.status!=='Phát sinh')b.status=r&&r.value?r.value:'Dự kiến';

function renderStats(){
  const td=new Date(),N=14,days=lastDays(N);
  const cnt=days.map(k=>S.blocks.filter(b=>b.day===k&&counted(b)).length);
  const range=S.range||7,st=statsFor(lastDays(range)),st7=range===7?st:statsFor(lastDays(7));
  let streak=0;for(let i=0;i<400;i++){const k=ymd(addDays(td,-i));if(S.days.some(x=>x.day===k))streak++;else if(i===0)continue;else break}
  const late=S.tasks.filter(isLate).length;
  const W=640,H=220,L=30,R=8,T=18,B=30,max=Math.max(2,...cnt),top=max<=5?max:Math.ceil(max/2)*2;
  const ticks=top<=5?[...Array(top+1).keys()]:[0,top/2,top];
  const y=v=>T+(H-T-B)*(1-v/top),slot=(W-L-R)/N,bw=slot*.58;
  let svg='<svg class="chart" viewBox="0 0 '+W+' '+H+'" role="img" aria-label="Số khối đã làm mỗi ngày trong 14 ngày qua">';
  ticks.forEach(v=>{svg+='<line class="grid" x1="'+L+'" x2="'+(W-R)+'" y1="'+y(v)+'" y2="'+y(v)+'"/><text x="'+(L-8)+'" y="'+(y(v)+4)+'" text-anchor="end">'+v+'</text>'});
  cnt.forEach((c,i)=>{const x=L+slot*i+(slot-bw)/2,h=(H-T-B)*c/top,dd=parse(days[i]);
    svg+='<rect class="b'+(i===N-1?' on':'')+'" x="'+x.toFixed(1)+'" y="'+(c?y(c):y(0)-2).toFixed(1)+'" width="'+bw.toFixed(1)+'" height="'+(c?h:2).toFixed(1)+'" rx="6"><title>'+dd.getDate()+'/'+(dd.getMonth()+1)+': '+c+' khối</title></rect>';
    if(c)svg+='<text class="val" x="'+(x+bw/2).toFixed(1)+'" y="'+(y(c)-6).toFixed(1)+'" text-anchor="middle">'+c+'</text>';

function render(){
  document.querySelectorAll('#tabs button').forEach(b=>{if(b.dataset.view===(S.view==='review'?'cal':S.view))b.setAttribute('aria-current','page');else b.removeAttribute('aria-current')});
  themeIcon();
  const n=userName();
  document.getElementById('meName').textContent=n;
  document.getElementById('avatar').textContent=(n||'?').trim().charAt(0).toUpperCase();
  const main=document.getElementById('main');
  if(!S.ready)return;
  if(S.view==='tasks'){
    if(main.dataset.view!=='tasks'){main.innerHTML=renderTasksShell();main.dataset.view='tasks'}
    else document.querySelectorAll('[data-act="fstatus"]').forEach(b=>b.setAttribute('aria-pressed',String(b.dataset.v===S.f.status)));
    renderTaskList();return;
  }
  if(S.view==='review'){
    // Đang nhập dở thì không vẽ lại (đồng bộ từ thiết bị khác sẽ chờ tới lần mở sau).
    if(main.dataset.view==='review'&&main.dataset.day===S.sel&&document.getElementById('reviewForm')){reviewSummary();return}
    main.dataset.view='review';main.dataset.day=S.sel;main.innerHTML=renderReview();reviewSummary();return;
  }
  main.dataset.view=S.view;
  main.innerHTML=S.view==='cal'?renderCal():S.view==='stats'?renderStats():renderHome();
}

// login | signup | forgot (gửi mail đặt lại) | newpass (sau khi bấm link trong mail)
let authMode=RECOVERY?'newpass':'login';
const NOAUTO='autocapitalize="none" autocorrect="off" spellcheck="false"';
function renderAuth(msg,ok){
  document.body.classList.add('signed-out');

  const md=authMode;
  const head={login:['Chào mừng trở lại!','Đăng nhập để xem kế hoạch của bạn trên mọi thiết bị.'],
    signup:['Tạo tài khoản MyPlan','Dùng email thật để nhận thư xác nhận.'],
    forgot:['Quên mật khẩu','Nhập email tài khoản, MyPlan sẽ gửi link để bạn đặt mật khẩu mới.'],
    newpass:['Đặt mật khẩu mới','Nhập mật khẩu mới (ít nhất 8 ký tự) rồi bấm Lưu.']}[md];
  const emailF='<label>Email<input id="a-email" class="field" type="email" autocomplete="email" '+NOAUTO+' required></label>';
  const passF=(lb,ac)=>'<label for="a-pass">'+lb+'</label><div class="pw"><input id="a-pass" class="field" type="password" minlength="8" autocomplete="'+ac+'" '+NOAUTO+' required><button type="button" class="pw-eye" data-act="pw-eye" aria-label="Hiện mật khẩu" aria-pressed="false">'+I.eye+'</button></div>';
  const fields={login:emailF+passF('Mật khẩu','current-password'),
    signup:'<label>Tên của bạn<input id="a-name" class="field" autocomplete="given-name" required maxlength="30" placeholder="VD: Phanh"></label>'+emailF+passF('Mật khẩu','new-password'),
    forgot:emailF,
    newpass:passF('Mật khẩu mới','new-password')}[md];
  const btnLb={login:'Đăng nhập',signup:'Tạo tài khoản',forgot:'Gửi link đặt lại',newpass:'Lưu mật khẩu'}[md];
  const links={login:'<button class="link-btn" data-act="auth-go" data-m="forgot">Quên mật khẩu?</button><br>Chưa có tài khoản? <button class="link-btn" style="color:var(--accent-deep)" data-act="auth-go" data-m="signup">Tạo tài khoản</button>',
    signup:'Đã có tài khoản? <button class="link-btn" style="color:var(--accent-deep)" data-act="auth-go" data-m="login">Đăng nhập</button>',
    forgot:'<button class="link-btn" style="color:var(--accent-deep)" data-act="auth-go" data-m="login">Quay lại đăng nhập</button>',
    newpass:''}[md];
  m.innerHTML='<section class="card auth"><img class="auth-art art" src="mascot.png" alt=""><h1>'+head[0]+'</h1><p>'+head[1]+'</p>'+
   '<form id="authForm">'+fields+(msg?'<div class="msg'+(ok?' ok':'')+'" role="status">'+esc(msg)+'</div>':'')+
   '<button class="pill-btn" type="submit" id="a-submit">'+btnLb+'</button></form>'+(links?'<div class="switch">'+links+'</div>':'')+'</section>';
  document.getElementById('authForm').onsubmit=async e=>{
    e.preventDefault();
    const val=id=>{const el=document.getElementById(id);return el?el.value:''};
    const email=val('a-email').trim().toLowerCase(),password=val('a-pass');
    const btn=document.getElementById('a-submit');btn.disabled=true;btn.textContent='Đang xử lý…';
    const here=location.origin+location.pathname;
    if(md==='login'){
      const {error}=await sb.auth.signInWithPassword({email,password});
      if(error)renderAuth(/not confirmed/i.test(error.message)?'Email chưa được xác nhận. Mở hộp thư và bấm link xác nhận trước.':'Email hoặc mật khẩu không đúng. Nếu không nhớ mật khẩu, bấm "Quên mật khẩu?" bên dưới.');
    }else if(md==='signup'){
      const {data,error}=await sb.auth.signUp({email,password,options:{data:{name:val('a-name').trim()},emailRedirectTo:here}});
      if(error)renderAuth(/not allowed|disabled/i.test(error.message)?'Trang này không nhận đăng ký mới.':'Không tạo được tài khoản: '+error.message);
      else if(!data.session){authMode='login';renderAuth('Đã gửi thư xác nhận tới '+email+'. Bấm link trong thư rồi quay lại đây đăng nhập.',true)}
    }else if(md==='forgot'){
      const {error}=await sb.auth.resetPasswordForEmail(email,{redirectTo:here});
      if(error)renderAuth(/rate|seconds/i.test(error.message)?'Bạn vừa yêu cầu rồi. Đợi 1 phút rồi thử lại.':'Chưa gửi được thư. Kiểm tra lại email rồi thử lại.');
      else{authMode='login';renderAuth('Đã gửi link đặt lại mật khẩu tới '+email+'. Mở thư trên chính thiết bị này và bấm link.',true)}
    }else{
      const {error}=await sb.auth.updateUser({password});
      if(error)renderAuth(/different/i.test(error.message)?'Mật khẩu mới phải khác mật khẩu cũ.':'Chưa đổi được mật khẩu. Link có thể đã hết hạn, hãy gửi lại link mới.');
      else{authMode='login';history.replaceState(null,'',location.pathname);toast('Đã đổi mật khẩu');onSession((await sb.auth.getSession()).data.session)}
    }
  };
}
function onSession(s){
  session=s;
  if(!s||authMode==='newpass'){if(channel){sb.removeChannel(channel);channel=null}S.ready=false;S.tasks=[];S.blocks=[];S.habits=[];S.days=[];S.goals=[];renderAuth();return}
  document.body.classList.remove('signed-out');
  const m=document.getElementById('main');if(m.dataset.view==='auth'){m.dataset.view='';m.innerHTML='<div class="loading">Đang tải…</div>'}
  render();loadAll();startSync();refreshPush().catch(()=>{});
}
async function boot(){
  if(DEMO){session={user:{email:'demo@myplan',user_metadata:{name:'Phanh'}}};demoData();render();refreshPush();return}
  sb.auth.onAuthStateChange((ev,s)=>{
    if(ev==='PASSWORD_RECOVERY'){authMode='newpass';session=s;renderAuth();return}
    if(ev==='INITIAL_SESSION')return;
    if(ev==='SIGNED_IN'&&session&&s&&s.user.id===session.user.id){session=s;return}
    if(ev==='TOKEN_REFRESHED'||ev==='USER_UPDATED'){session=s;if(authMode!=='newpass')render();return}
    if(ev==='SIGNED_IN'||ev==='SIGNED_OUT')onSession(s);
  });
  const {data}=await sb.auth.getSession();
  onSession(data.session);
}

  mroot.innerHTML='<div class="overlay" data-act="close-bg"><form class="modal" id="habitForm" role="dialog" aria-modal="true" aria-labelledby="mh"><h3 id="mh">Thói quen theo dõi</h3><div class="form">'+
   [0,1,2].map(i=>'<label class="full">Thói quen '+(i+1)+'<input class="field" name="h" data-id="'+esc(act[i]?act[i].id:'')+'" maxlength="60" value="'+esc(act[i]?act[i].name:'')+'" placeholder="'+(i===0?'VD: Ngủ trước 23h':'Để trống nếu không cần')+'"></label>').join('')+
   '<p class="full muted" style="margin:0;font-size:13.5px">Tối đa 3 thói quen. Xoá tên một thói quen thì ngừng theo dõi, dữ liệu các ngày cũ vẫn giữ.</p></div>'+
   '<div class="m-actions"><span class="sp"></span><button type="button" class="btn" data-act="close">Huỷ</button><button class="btn primary" type="submit">Lưu</button></div></form></div>';
  document.getElementById('habitForm').onsubmit=async e=>{e.preventDefault();
    const out=[];
    document.querySelectorAll('#habitForm input[name="h"]').forEach((el,i)=>{const name=el.value.trim(),id=el.dataset.id,old=S.habits.find(h=>h.id===id);
      if(name)out.push({id:id||uid(),name,position:i,active:true});else if(old)out.push({...old,active:false})});
    const inReview=S.view==='review';if(inReview)captureDraft();
    closeModal();await writeMany('habits',out);toast('Đã lưu thói quen');
    if(inReview)rerenderReview();
  };
}
function goalModal(g){
  const isNew=!g.id,p=+g.progress||0;
  mroot.innerHTML='<div class="overlay" data-act="close-bg"><form class="modal" id="goalForm" role="dialog" aria-modal="true" aria-labelledby="mg"><h3 id="mg">'+(isNew?'Thêm mục tiêu':'Cập nhật mục tiêu')+'</h3><div class="form">'+
   '<label class="full">Mục tiêu<input id="g-title" class="field" required maxlength="120" value="'+esc(g.title||'')+'" placeholder="VD: Nâng cao kỹ năng edit video"></label>'+
   '<label class="full">Mô tả ngắn<input id="g-desc" class="field" maxlength="160" value="'+esc(g.desc||'')+'" placeholder="VD: Thành thạo CapCut và làm video sáng tạo hơn"></label>'+
   '<label class="full">Tiến độ<div class="range-row"><input id="g-prog" type="range" min="0" max="100" step="5" value="'+p+'"><output id="g-out" class="num" style="min-width:44px;font-weight:800">'+p+'%</output></div></label>'+
   '<label>Thời hạn<input id="g-deadline" class="field" type="date" value="'+esc(g.deadline||'')+'"></label>'+
   '<label>Màu<select id="g-color" class="field">'+GOAL_COLORS.map(c=>'<option value="'+c[0]+'"'+(goalColor(g.color)===c[0]?' selected':'')+'>'+c[1]+'</option>').join('')+'</select></label>'+
   '<label class="full">Hình minh hoạ<select id="g-icon" class="field">'+GOAL_ICONS.map(c=>'<option value="'+c[0]+'"'+((g.icon||'target')===c[0]?' selected':'')+'>'+c[1]+'</option>').join('')+'</select></label></div>'+
   '<div class="m-actions">'+(isNew?'':'<button type="button" class="btn danger" data-act="del-goal" data-id="'+esc(g.id)+'">Xoá</button>')+'<span class="sp"></span><button type="button" class="btn" data-act="close">Huỷ</button><button class="btn primary" type="submit">'+(isNew?'Thêm':'Lưu')+'</button></div></form></div>';
  const r=document.getElementById('g-prog');r.oninput=()=>document.getElementById('g-out').textContent=r.value+'%';
  document.getElementById('goalForm').onsubmit=e=>{e.preventDefault();
    const v=id=>document.getElementById(id).value;
    const title=v('g-title').trim();if(!title)return;
    const o={...g,id:g.id||uid(),title,desc:v('g-desc').trim(),progress:+r.value,deadline:v('g-deadline'),color:v('g-color'),icon:v('g-icon')};
    closeModal();write('goals',o);toast(isNew?'Đã thêm mục tiêu':'Đã lưu');
  };
}
/* ---------- thông báo nhắc việc (Web Push) ---------- */
const isIOS=/iphone|ipad|ipod/i.test(navigator.userAgent)||(navigator.platform==='MacIntel'&&navigator.maxTouchPoints>1);
const isStandalone=matchMedia('(display-mode: standalone)').matches||navigator.standalone===true;
const pushSupported='serviceWorker' in navigator&&'PushManager' in window&&'Notification' in window&&location.protocol==='https:';
S.push='checking';
async function refreshPush(){
  if(DEMO){S.push='off'}
  else if(!pushSupported)S.push=isIOS&&!isStandalone?'need-install':'unsupported';
  else if(Notification.permission==='denied')S.push='denied';
  else{const reg=await navigator.serviceWorker.ready;S.push=(await reg.pushManager.getSubscription())?'on':'off'}
  const box=document.getElementById('pushBox');if(box)box.innerHTML=pushBoxHtml();
  if(S.view==='home'&&S.ready)render();
}
function b64uToBytes(s){const b=atob(s.replace(/-/g,'+').replace(/_/g,'/')+'==='.slice((s.length+3)%4));return Uint8Array.from(b,c=>c.charCodeAt(0))}
async function enablePush(){
  if(DEMO){toast('Đây là bản xem thử, hãy đăng nhập để bật thông báo');return}
  // Hỏi quyền ngay trong lần bấm (iPhone yêu cầu).
  const perm=await Notification.requestPermission();
  if(perm!=='granted'){await refreshPush();toast(perm==='denied'?'Bạn đã chặn thông báo. Mở Cài đặt → Thông báo → MyPlan để bật lại.':'Chưa bật thông báo');return}
  try{
    const reg=await navigator.serviceWorker.ready;
    const sub=(await reg.pushManager.getSubscription())||await reg.pushManager.subscribe({userVisibleOnly:true,applicationServerKey:b64uToBytes(CFG.vapidPublicKey)});
    const j=sub.toJSON();
    const {error}=await sb.from('push_subscriptions').upsert({endpoint:j.endpoint,p256dh:j.keys.p256dh,auth:j.keys.auth},{onConflict:'endpoint'});
    if(error)throw error;
    toast('Đã bật nhắc việc trước 10 phút');
  }catch(e){toast('Chưa bật được thông báo. Thử lại sau.')}
  await refreshPush();
}
async function disablePush(){
  const reg=await navigator.serviceWorker.ready,sub=await reg.pushManager.getSubscription();
  if(sub){await sb.from('push_subscriptions').delete().eq('endpoint',sub.endpoint);await sub.unsubscribe()}
  toast('Đã tắt thông báo trên thiết bị này');await refreshPush();
}
async function testPush(btn){
  btn.disabled=true;btn.textContent='Đang gửi…';
  const {data,error}=await sb.functions.invoke('send-reminders',{body:{test:true}});
  btn.disabled=false;btn.textContent='Gửi thử';
  toast(error?'Chưa gửi được. Thử lại sau.':data&&data.sent?'Đã gửi, xem thông báo trên máy nhé':'Không tìm thấy thiết bị đã bật thông báo');
}
function pushBoxHtml(){
  const st=S.push;
  const txt={checking:'Đang kiểm tra…',
    on:'<b>Đang bật</b> trên thiết bị này. MyPlan nhắc trước 10 phút mỗi việc có giờ.',
    off:'Nhận thông báo trước 10 phút mỗi việc có giờ, kể cả khi đang khoá màn hình.',
    'need-install':'Trên iPhone, hãy thêm MyPlan ra màn hình chính trước: Safari → nút Chia sẻ → <b>Thêm vào MH chính</b>, rồi mở app từ màn hình chính.',
    denied:'Thông báo đang bị chặn. Mở <b>Cài đặt → Thông báo → MyPlan</b> để cho phép, rồi quay lại đây.',
    unsupported:'Trình duyệt này chưa hỗ trợ thông báo. Trên iPhone cần iOS 16.4 trở lên.'}[st];
  const btns=st==='on'?'<button type="button" class="btn" data-act="push-test">Gửi thử</button><button type="button" class="btn danger" data-act="push-off">Tắt</button>':
    st==='off'?'<button type="button" class="btn primary" data-act="push-on">Bật thông báo</button>':'';
  return '<div class="push-h">🔔 Nhắc việc</div><p>'+txt+'</p>'+(btns?'<div class="push-btns">'+btns+'</div>':'');
}
function pushBanner(){
  if(!(S.push==='off'||S.push==='need-install')||lsGet('myplan-push-dismiss'))return '';
  return '<section class="card push-banner"><div><b>🔔 Bật nhắc việc trên điện thoại</b><p>'+(S.push==='need-install'?'Thêm MyPlan ra màn hình chính (Safari → Chia sẻ → Thêm vào MH chính), mở app từ đó rồi bật thông báo.':'MyPlan sẽ nhắc trước 10 phút mỗi tiết dạy, buổi học và việc có giờ.')+'</p></div>'+
    '<div class="push-btns">'+(S.push==='off'?'<button class="pill-btn" data-act="push-on">Bật thông báo</button>':'')+'<button class="link-btn" data-act="push-dismiss">Để sau</button></div></section>';
}
function profileModal(){
  mroot.innerHTML='<div class="overlay" data-act="close-bg"><form class="modal" id="profForm" role="dialog" aria-modal="true" aria-labelledby="mp"><h3 id="mp">Tài khoản</h3><div class="form">'+
   '<label class="full">Tên hiển thị<input id="p-name" class="field" required maxlength="30" value="'+esc(userName())+'"></label>'+
   '<p class="full muted" style="margin:0;font-size:14px">Email: '+esc(session.user.email)+'</p>'+
   '<div class="full push-box" id="pushBox">'+pushBoxHtml()+'</div></div>'+
   '<div class="m-actions"><button type="button" class="btn danger" data-act="logout">Đăng xuất</button><span class="sp"></span><button type="button" class="btn" data-act="close">Huỷ</button><button class="btn primary" type="submit">Lưu</button></div></form></div>';
  document.getElementById('profForm').onsubmit=async e=>{e.preventDefault();
    const name=document.getElementById('p-name').value.trim();if(!name)return;
    closeModal();const {error}=await sb.auth.updateUser({data:{name}});
    if(error)toast('Chưa đổi được tên. Thử lại sau.');else toast('Đã đổi tên');
  };
}
function armDelete(btn,fn){
  if(btn.classList.contains('armed')){fn();closeModal();return}
  btn.classList.add('armed');btn.textContent='Bấm lần nữa để xoá';
  setTimeout(()=>{if(btn.isConnected){btn.classList.remove('armed');btn.textContent='Xoá'}},3000);
}
let tt;function toast(msg){const r=document.getElementById('toastRoot');r.innerHTML='<div class="toast" role="status">'+esc(msg)+'</div>';clearTimeout(tt);tt=setTimeout(()=>r.innerHTML='',2600)}

/* ---------- events ---------- */
document.addEventListener('click',e=>{
  const el=e.target.closest('[data-act]');if(!el)return;
  const a=el.dataset.act,id=el.dataset.id;
  if(a==='close-bg'){if(e.target===el)closeModal();return}
  if(a==='close'){closeModal();return}
  if(a==='nav'){S.view=el.dataset.view;S.draft=null;lsSet('myplan-view',S.view);render();window.scrollTo(0,0);return}
  if(a==='theme'){const n=isDark()?'light':'dark';document.documentElement.dataset.theme=n;lsSet('myplan-theme',n);themeIcon();return}
  if(a==='profile'){if(session)profileModal();return}
  if(a==='logout'){closeModal();sb.auth.signOut();return}
  if(a==='push-on'){enablePush();return}
  if(a==='push-off'){disablePush();return}
  if(a==='push-test'){testPush(el);return}
  if(a==='push-dismiss'){lsSet('myplan-push-dismiss','1');render();return}
  if(a==='pw-eye'){const inp=el.previousElementSibling,show=inp.type==='password';inp.type=show?'text':'password';el.setAttribute('aria-pressed',String(show));el.setAttribute('aria-label',show?'Ẩn mật khẩu':'Hiện mật khẩu');el.innerHTML=show?I.eyeOff:I.eye;inp.focus();return}
  if(a==='auth-go'){authMode=el.dataset.m;renderAuth();return}
  if(a==='toggle'){const t=S.tasks.find(x=>x.id===id);if(!t)return;const o={...t,updatedAt:new Date().toISOString()};if(o.status==='done'){o.status='todo';delete o.doneAt}else{o.status='done';o.doneAt=today()}write('tasks',o);return}
  if(a==='edit'){const t=S.tasks.find(x=>x.id===id);if(t)taskModal(t);return}
  if(a==='new-task'){taskModal({cat:'Công việc',estimate:''});return}
  if(a==='del-task'){armDelete(el,()=>{remove('tasks',id);toast('Đã xoá việc')});return}
  if(a==='toggle-block'){const b=S.blocks.find(x=>x.id===id);if(!b)return;const o={...b};if(o.status==='Đã làm'){o.status='Dự kiến';o.aStart='';o.aEnd=''}else{o.status='Đã làm';o.d4=o.d4||D4_FROM_TAG[o.tag]||''}write('blocks',o);return}
  if(a==='edit-block'){const b=S.blocks.find(x=>x.id===id);if(b)blockModal(b);return}
  if(a==='new-block'){const tk=el.dataset.task?S.tasks.find(x=>x.id===el.dataset.task):null;blockModal({day:el.dataset.date||S.sel||today(),taskId:tk?tk.id:'',title:tk?tk.title:'',status:el.dataset.ps?'Phát sinh':'Dự kiến'});return}
  if(a==='del-block'){armDelete(el,()=>{remove('blocks',id);toast('Đã xoá khối giờ');if(S.view==='review')rerenderReview()});return}
  if(a==='review'){S.sel=el.dataset.date||today();S.draft=null;S.view='review';window.scrollTo(0,0);render();return}
  if(a==='habits'){habitModal();return}
  if(a==='range'){S.range=+el.dataset.n;render();return}
  if(a==='bl-set'||a==='bl-drop'){const t=S.tasks.find(x=>x.id===id);if(!t)return;const o={...t,updatedAt:new Date().toISOString()};
    if(a==='bl-set'){const v=document.getElementById('bl-'+id).value;if(!v){toast('Chọn ngày trước');return}o.deadline=v;o.status='todo'}else o.status='dropped';
    captureDraft();write('tasks',o);toast(a==='bl-set'?'Đã đặt hạn, việc về Chưa làm':'Đã chuyển sang Bỏ');rerenderReview();return}
  if(a==='edit-goal'){const g=S.goals.find(x=>x.id===id);if(g)goalModal(g);return}
  if(a==='new-goal'){goalModal({progress:0,color:'green',icon:'target'});return}
  if(a==='del-goal'){armDelete(el,()=>{remove('goals',id);toast('Đã xoá mục tiêu')});return}
  if(a==='mon'){const n=+el.dataset.n,m=S.calMonth;if(n)S.calMonth=new Date(m.getFullYear(),m.getMonth()+n,1);else{const t=new Date();S.calMonth=new Date(t.getFullYear(),t.getMonth(),1);S.sel=today()}render();return}
  if(a==='wkshift'){const d=addDays(parse(S.sel),+el.dataset.n);S.sel=ymd(d);S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);render();return}
  if(a==='sel'){S.sel=el.dataset.date;const d=parse(S.sel);S.calMonth=new Date(d.getFullYear(),d.getMonth(),1);if(S.view!=='cal'){S.view='cal';lsSet('myplan-view','cal');window.scrollTo(0,0)}render();return}
  if(a==='fstatus'){S.f.status=el.dataset.v;render();return}
});
document.addEventListener('input',e=>{if(e.target.id==='fq'){S.f.q=e.target.value;renderTaskList()}else if(e.target.closest('#reviewForm'))reviewSummary()});
document.addEventListener('submit',e=>{if(e.target.id==='reviewForm'){e.preventDefault();saveReview()}});
document.addEventListener('change',e=>{if(e.target.id==='fcat'){S.f.cat=e.target.value;renderTaskList()}else if(e.target.closest('#reviewForm'))reviewSummary()});
document.addEventListener('keydown',e=>{if(e.key==='Escape'&&mroot.innerHTML)closeModal()});

themeIcon();
boot();
if('serviceWorker' in navigator&&location.protocol==='https:'){
  // Khi có bản app mới, service worker mới tiếp quản: tải lại trang một lần để hiện bản mới.
  const hadController=!!navigator.serviceWorker.controller;let reloaded=false;
  navigator.serviceWorker.addEventListener('controllerchange',()=>{if(hadController&&!reloaded&&!mroot.innerHTML){reloaded=true;location.reload()}});
  navigator.serviceWorker.register('sw.js',{updateViaCache:'none'}).then(r=>{
    document.addEventListener('visibilitychange',()=>{if(!document.hidden)r.update().catch(()=>{})});
  }).catch(()=>{});
}
})();
</script>
